name: Provision VM - Local Testing (Azurite State)

on:
  push:
    branches:
      - main
    paths:
      - 'terraform/**'
      - '.github/workflows/vm-provision-workflow.yml'
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  TERRAFORM_VERSION: 1.8.0
  AZURE_STORAGE_ACCOUNT: devstoreaccount1
  AZURE_STORAGE_KEY: Eby8vdM02xNOcqFlqUwJPLlmEtlCDXeOFYAixTcSxaU=
  AZURE_STORAGE_USE_HTTPS: false
  ARM_ENDPOINT: http://127.0.0.1:10000

jobs:
  azurite-start:
    name: Start Azurite Emulator
    runs-on: ubuntu-latest
    steps:
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Azurite
        run: npm install -g azurite

      - name: Create data directory
        run: mkdir -p ~/azurite-data

      - name: Start Azurite
        run: |
          azurite --silent --location ~/azurite-data &
          sleep 5
          echo "Azurite started on port 10000"

      - name: Verify Azurite is running
        run: |
          curl -v http://127.0.0.1:10000/devstoreaccount1

  terraform-validate:
    name: Terraform Validate & Plan
    runs-on: ubuntu-latest
    needs: azurite-start
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive terraform/
        continue-on-error: true

      - name: Terraform Init (Azurite Backend)
        working-directory: terraform/
        run: |
          terraform init \
            -backend-config="storage_account_name=${{ env.AZURE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=vm.tfstate" \
            -backend-config="resource_group_name=local-dev" \
            -backend-config="use_azuread_auth=false"
        env:
          ARM_USE_AZUREAD: false
          ARM_ENDPOINT: ${{ env.ARM_ENDPOINT }}

      - name: Terraform Validate
        working-directory: terraform/
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform/
        id: plan
        run: |
          terraform plan \
            -var="vm_name=test-vm-local" \
            -var="resource_group_name=local-rg" \
            -var="location=eastus" \
            -out=tfplan
        env:
          ARM_USE_AZUREAD: false
          ARM_ENDPOINT: ${{ env.ARM_ENDPOINT }}
        continue-on-error: true

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan

  security-scan:
    name: Security Scan (Checkov)
    runs-on: ubuntu-latest
    needs: azurite-start
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Checkov on Terraform
        id: checkov
        uses: bridgecrewio/checkov-action@master
        with:
          directory: terraform/
          framework: terraform
          skip-check: CKV_AZURE_1,CKV_AZURE_2
        continue-on-error: true

      - name: Upload Checkov Report
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: report.sarif
        if: always()

  terraform-apply:
    name: Terraform Apply (Azurite State)
    runs-on: ubuntu-latest
    needs: [terraform-validate, security-scan]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Start Azurite
        run: |
          npm install -g azurite
          mkdir -p ~/azurite-data
          azurite --silent --location ~/azurite-data &
          sleep 5

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform/

      - name: Terraform Init
        working-directory: terraform/
        run: |
          terraform init \
            -backend-config="storage_account_name=${{ env.AZURE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=vm.tfstate" \
            -backend-config="resource_group_name=local-dev" \
            -backend-config="use_azuread_auth=false"
        env:
          ARM_USE_AZUREAD: false
          ARM_ENDPOINT: ${{ env.ARM_ENDPOINT }}

      - name: Terraform Apply
        working-directory: terraform/
        run: terraform apply -auto-approve tfplan
        env:
          ARM_USE_AZUREAD: false
          ARM_ENDPOINT: ${{ env.ARM_ENDPOINT }}
        continue-on-error: true

      - name: Get Terraform Outputs
        working-directory: terraform/
        id: tf-output
        run: terraform output -json > outputs.json
        continue-on-error: true

      - name: Upload Outputs
        uses: actions/upload-artifact@v4
        with:
          name: terraform-outputs
          path: terraform/outputs.json
        if: always()

  test-vm:
    name: Test VM Configuration
    runs-on: ubuntu-latest
    needs: terraform-apply
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Outputs
        uses: actions/download-artifact@v4
        with:
          name: terraform-outputs
          path: ./

      - name: Display VM Details
        run: |
          if [ -f outputs.json ]; then
            echo "=== VM Configuration ==="
            cat outputs.json | jq .
          else
            echo "No outputs available (expected in local testing)"
          fi

  cleanup:
    name: Cleanup (Local Testing)
    runs-on: ubuntu-latest
    needs: [terraform-apply, test-vm]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Start Azurite
        run: |
          npm install -g azurite
          mkdir -p ~/azurite-data
          azurite --silent --location ~/azurite-data &
          sleep 5

      - name: Terraform Init
        working-directory: terraform/
        run: |
          terraform init \
            -backend-config="storage_account_name=${{ env.AZURE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=vm.tfstate" \
            -backend-config="resource_group_name=local-dev" \
            -backend-config="use_azuread_auth=false"
        env:
          ARM_USE_AZUREAD: false
          ARM_ENDPOINT: ${{ env.ARM_ENDPOINT }}

      - name: Terraform Destroy
        working-directory: terraform/
        run: |
          terraform destroy \
            -var="vm_name=test-vm-local" \
            -var="resource_group_name=local-rg" \
            -var="location=eastus" \
            -auto-approve
        env:
          ARM_USE_AZUREAD: false
          ARM_ENDPOINT: ${{ env.ARM_ENDPOINT }}
        continue-on-error: true

      - name: Cleanup Azurite Data
        run: rm -rf ~/azurite-data
        if: always()
